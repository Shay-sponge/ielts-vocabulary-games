<!doctype html>
<html lang="zh-CN">
<head>

  <title>剑桥雅思20高难词汇 · 记忆探险 Lesson 02</title>
  <style>
    :root{--night:#17223b;--purple:#7357d6;--violet:#ece8ff;--sun:#ffc857;--paper:#fbfaf6;--ink:#17223b;--muted:#697188;--line:#dde0e8;--good:#24966d;--bad:#d95757}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,Arial,"PingFang SC",sans-serif}button{font:inherit;cursor:pointer}.top{height:68px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;background:var(--night);color:#fff}.brand{display:flex;align-items:center;gap:11px;font-weight:900}.logo{width:41px;height:41px;display:grid;place-items:center;border:2px solid var(--sun);border-radius:12px;transform:rotate(-3deg);color:var(--sun);font-family:Georgia,serif}.top small{color:#bfc6dc;letter-spacing:.14em}.hero{background:var(--night);color:#fff;padding:46px 7vw 52px;display:grid;grid-template-columns:1.4fr .8fr;gap:35px;align-items:center;position:relative;overflow:hidden}.hero:after{content:"02";position:absolute;right:4vw;bottom:-60px;color:#ffffff08;font:900 220px Arial}.eyebrow{color:var(--sun);font-size:10px;letter-spacing:.18em;font-weight:900}.hero h1{font:500 clamp(39px,5.7vw,72px)/.98 Georgia,"Songti SC",serif;margin:15px 0}.hero h1 em{color:var(--sun)}.hero p{color:#c6ccdc;font-size:13px;line-height:1.7}.progressBox{position:relative;z-index:1;border:1px solid #ffffff2e;background:#ffffff0d;border-radius:18px;padding:23px}.progressBox>div:first-child{display:flex;justify-content:space-between;align-items:end}.progressBox strong{font-size:31px;color:var(--sun)}.progressBox span{font-size:10px;color:#bac2d5}.bar{height:7px;background:#ffffff1c;border-radius:10px;margin:16px 0 9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--sun);transition:.3s}.progressBox small{font-size:10px;color:#c8cedd}.tabs{display:flex;justify-content:center;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.tabs button{border:0;border-bottom:3px solid transparent;background:#fff;padding:18px 27px;color:#777f94;font-size:12px;font-weight:800}.tabs button.on{color:var(--purple);border-color:var(--purple)}main{max-width:1120px;margin:38px auto 65px;padding:0 22px}.missionTop{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.missionTop h2{font:500 30px Georgia,"Songti SC",serif;margin:6px 0}.missionTop p{margin:0;color:var(--muted);font-size:12px}.zones{display:flex;gap:7px}.zones span{padding:7px 10px;border-radius:20px;background:#eceef3;color:#7c8499;font-size:9px;font-weight:800}.zones .active{background:var(--violet);color:var(--purple)}.layout{display:grid;grid-template-columns:1fr 280px;gap:22px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 16px 45px #17223b0c;overflow:hidden}.story{padding:34px 39px}.step{display:flex;justify-content:space-between;color:#8a91a3;font-size:9px;letter-spacing:.14em;font-weight:900}.wordline{display:flex;justify-content:space-between;align-items:center;margin:27px 0 22px}.wordline h3{font:500 clamp(45px,7vw,72px)/1 Georgia,serif;margin:0;letter-spacing:-.03em}.wordline p{margin:8px 0 0;color:#858da1;font-size:12px}.sound{border:1px solid #d7d2f4;background:var(--violet);color:var(--purple);width:50px;height:50px;border-radius:50%;font-weight:bold}.scene{background:var(--night);color:#fff;padding:21px 23px;border-radius:12px;position:relative}.scene:before{content:"剧情";position:absolute;right:14px;top:12px;font-size:9px;letter-spacing:.15em;color:#ffffff60}.scene small,.example small,.memory small{font-size:9px;letter-spacing:.13em;font-weight:900;color:var(--sun)}.scene p{font:18px/1.65 Georgia,"Songti SC",serif;margin:9px 0 0}.example{padding:22px 2px 14px}.example small{color:var(--purple)}.example p{font:italic 19px/1.5 Georgia,serif;margin:8px 0}.guess{width:100%;border:1px dashed #aca4dc;background:#f8f6ff;border-radius:9px;padding:15px;color:var(--purple);font-weight:900;font-size:12px}.answer{display:none;grid-template-columns:.8fr 1.3fr 1.2fr;border:1px solid #ddd9f0;border-radius:10px;overflow:hidden}.answer.show{display:grid}.answer>div{padding:14px 16px;border-right:1px solid #ddd9f0}.answer>div:last-child{border:0}.answer small{display:block;color:#8d849f;font-size:9px;letter-spacing:.1em}.answer b{display:block;color:var(--purple);font-size:17px;margin-top:7px}.answer p{font-size:11px;line-height:1.55;margin:7px 0 0}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}.actions button{padding:11px 14px;border:1px solid #d8dbe4;background:#fff;border-radius:8px;font-size:10px;font-weight:800;color:#71798d}.actions .got{background:var(--purple);color:white;border-color:var(--purple)}.map{padding:19px;height:max-content}.map h3{font-size:12px;margin:0 0 16px}.wordList{display:grid;grid-template-columns:1fr 1fr;gap:7px}.wordList button{border:1px solid #e1e3ea;background:#fff;border-radius:9px;padding:10px 9px;text-align:left;color:#586078;font:600 12px Georgia}.wordList button span{display:block;font:9px Arial;color:#9aa0b0;margin-top:3px}.wordList button.current{background:var(--night);color:#fff;border-color:var(--night)}.wordList button.done:after{content:" ✓";color:var(--good)}.tip{margin-top:16px;background:#fff6dd;padding:13px;border-radius:9px;font-size:10px;line-height:1.6;color:#71633d}.quiz{padding:42px 48px;text-align:center}.quiz .label{font-size:9px;letter-spacing:.18em;font-weight:900;color:var(--purple)}.quiz h2{font:500 34px Georgia,"Songti SC",serif;margin:13px}.timer{width:46px;height:46px;display:grid;place-items:center;margin:20px auto;border-radius:50%;background:var(--night);color:var(--sun);font-weight:900}.question{background:#f0edff;border-left:4px solid var(--purple);padding:24px 27px;text-align:left;font:italic 24px/1.55 Georgia,serif}.choices{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:18px}.choices button{text-align:left;border:1px solid #dce0e8;background:#fff;padding:19px 20px;border-radius:11px}.choices b{font:600 20px Georgia}.choices span{display:block;color:#7b8396;font-size:10px;margin-top:5px}.choices .correct{border:2px solid var(--good);background:#eaf8f2}.choices .wrong{border:2px solid var(--bad);background:#fff0f0}.feedback{display:none;margin-top:17px;padding:16px 18px;background:#eef8f3;border-radius:9px;text-align:left;font-size:12px;line-height:1.6}.feedback.show{display:block}.feedback button{float:right;border:0;background:var(--night);color:#fff;border-radius:7px;padding:9px 13px}.boss{display:grid;grid-template-columns:1fr .9fr;gap:28px;padding:35px}.bossCopy{padding:15px}.boss h2{font:500 42px Georgia,"Songti SC",serif;margin:12px 0}.boss p{line-height:1.75;color:#687087;font-size:13px}.rules{padding:0;list-style:none}.rules li{display:flex;gap:12px;border-top:1px solid var(--line);padding:13px 0;font-size:11px}.rules b{color:var(--purple)}.bossCard{background:linear-gradient(145deg,#6e54d5,#382879);color:#fff;border-radius:18px;padding:35px 25px;text-align:center;box-shadow:10px 11px #dcd5ff}.bossCard small{letter-spacing:.15em;color:#d8d0ff}.bossCard h3{font:500 40px Georgia;margin:30px 0 8px}.bossCard p{color:#ddd7f7;font-size:11px}.bossCard button{margin-top:25px;border:1px solid #ffffff65;background:#ffffff12;color:#fff;border-radius:25px;padding:11px 17px}footer{text-align:center;padding:24px;border-top:1px solid var(--line);color:#858ca0;font-size:9px;letter-spacing:.12em}@media(max-width:760px){.top small{display:none}.hero{grid-template-columns:1fr;padding:36px 24px}.tabs{justify-content:flex-start;overflow:auto}.tabs button{white-space:nowrap}.layout,.boss{grid-template-columns:1fr}.missionTop{display:block}.zones{margin-top:13px}.story,.quiz{padding:25px 21px}.map{order:-1}.wordList{display:flex;overflow:auto}.wordList button{min-width:105px}.answer,.choices{grid-template-columns:1fr}.answer>div{border-right:0;border-bottom:1px solid #ddd9f0}.question{font-size:20px}}
  </style>
</head>
<body>
  <header class="top"><div class="brand"><span class="logo">C20</span><span>词汇记忆探险</span></div><small>LESSON 02 · NEW WORDS ONLY</small></header>
  <section class="hero"><div><span class="eyebrow">今日任务 · 失落科研岛</span><h1>不是背 12 个词，<br>而是<em>完成一次探险。</em></h1><p>每个词都是剧情中的一把钥匙。看故事、作判断、主动想起——让大脑有理由记住它。</p></div><div class="progressBox"><div><div><strong id="knownCount">0</strong><span> / 12 WORDS</span></div><span id="percent">0%</span></div><div class="bar"><i id="barFill"></i></div><small id="streakText">探险连胜 🔥 0</small></div></section>
  <nav class="tabs"><button class="on" data-mode="story">🗺 剧情路线</button><button data-mode="quiz">⚡ 反应挑战</button><button data-mode="boss">♛ BOSS BATTLE</button></nav>
  <main id="app"></main><footer>CAMBRIDGE IELTS 20 · VOCABULARY LAB　|　LESSON 02 · 与 Lesson 01 零重复</footer>
  <script>
const words=[
{w:'ascertain',p:'/ˌæsəˈteɪn/',pos:'v.',cn:'查明；确定',zone:'调查站',hook:'侦探把所有线索钉在墙上，最后“查明”真相。',root:'certain（确定）→ 通过调查使其确定',s:'Scientists tried to ___ the cause of the sudden decline.',col:'ascertain the cause / facts / truth',wrong:'assume',wrongCn:'假定'},
{w:'prevalent',p:'/ˈprevələnt/',pos:'adj.',cn:'普遍存在的；盛行的',zone:'调查站',hook:'一种现象铺满整张地图，不是偶尔出现，而是到处盛行。',root:'prevail（占优势）→ 大范围占据优势',s:'This belief remains ___ in many rural communities.',col:'be prevalent among / in',wrong:'rare',wrongCn:'罕见的'},
{w:'indigenous',p:'/ɪnˈdɪdʒənəs/',pos:'adj.',cn:'本土的；土生土长的',zone:'调查站',hook:'一棵树不是后来搬来的，它从很久以前就在这片土地上生长。',root:'indigena（土生者）→ 原生于当地',s:'The island is home to several ___ plant species.',col:'indigenous people / species / knowledge',wrong:'imported',wrongCn:'进口的；外来的'},
{w:'susceptible',p:'/səˈseptəbəl/',pos:'adj.',cn:'易受影响的；易感染的',zone:'生态谷',hook:'像没穿雨衣的人，云一来就最容易被淋湿。',root:'suscept（承受）+ -ible（能够）→ 容易受到',s:'Young plants are especially ___ to frost damage.',col:'be susceptible to disease / influence',wrong:'immune',wrongCn:'免疫的'},
{w:'reinforce',p:'/ˌriːɪnˈfɔːs/',pos:'v.',cn:'加强；强化',zone:'生态谷',hook:'给摇晃的桥再加一层钢架，让它变得更牢。',root:'re-（再次）+ inforce（加力）',s:'Positive feedback can ___ a student’s confidence.',col:'reinforce an idea / structure / belief',wrong:'weaken',wrongCn:'削弱'},
{w:'predominantly',p:'/prɪˈdɒmɪnəntli/',pos:'adv.',cn:'主要地；占主导地',zone:'生态谷',hook:'一盒糖里十颗有八颗是紫色——紫色“占主导”。',root:'pre-（在前）+ dominant（主导的）',s:'The region is ___ covered by tropical forest.',col:'predominantly rural / male / composed of',wrong:'equally',wrongCn:'同等地'},
{w:'obsolete',p:'/ˈɒbsəliːt/',pos:'adj.',cn:'淘汰的；过时的',zone:'旧基地',hook:'老式磁带机躺在仓库里：还能认出来，却早已不再使用。',root:'obsolescere（逐渐不用）→ 被时代淘汰',s:'Many manual systems became ___ after automation.',col:'become / render something obsolete',wrong:'innovative',wrongCn:'创新的'},
{w:'facilitate',p:'/fəˈsɪlɪteɪt/',pos:'v.',cn:'促进；使便利',zone:'旧基地',hook:'在陡坡上铺一条滑道，让原本困难的事变容易。',root:'facilis（容易）→ 使某事更容易',s:'Digital tools can ___ communication between teams.',col:'facilitate learning / communication / access',wrong:'hinder',wrongCn:'阻碍'},
{w:'compelling',p:'/kəmˈpelɪŋ/',pos:'adj.',cn:'令人信服的；引人入胜的',zone:'旧基地',hook:'一块强磁铁把注意力牢牢吸住，让你不得不相信或继续看。',root:'compel（迫使）→ 强到让人无法忽视',s:'The study provides ___ evidence for the new theory.',col:'compelling evidence / reason / story',wrong:'unconvincing',wrongCn:'无法令人信服的'},
{w:'profound',p:'/prəˈfaʊnd/',pos:'adj.',cn:'深远的；深刻的',zone:'核心舱',hook:'不是水洼，而是看不到底的深海——影响深入而长久。',root:'pro-（向前）+ fundus（底部）→ 深到底部',s:'The discovery had a ___ impact on modern medicine.',col:'a profound effect / change / insight',wrong:'superficial',wrongCn:'表面的'},
{w:'controversial',p:'/ˌkɒntrəˈvɜːʃəl/',pos:'adj.',cn:'有争议的',zone:'核心舱',hook:'同一个按钮，一半人说必须按，另一半人坚决反对。',root:'controversy（争议）+ -al（……的）',s:'The proposal remains highly ___ among local residents.',col:'a controversial issue / decision / claim',wrong:'unanimous',wrongCn:'一致同意的'},
{w:'coherent',p:'/kəʊˈhɪərənt/',pos:'adj.',cn:'连贯的；条理清楚的',zone:'核心舱',hook:'散落的拼图终于严丝合缝，组成一幅能看懂的完整图。',root:'co-（共同）+ here（黏合）→ 黏在一起',s:'The data must be organised into a ___ argument.',col:'a coherent argument / account / strategy',wrong:'fragmented',wrongCn:'支离破碎的'}];
let i=0,mode='story',known=new Set(),streak=0,locked=false;const app=document.querySelector('#app');
function stats(){knownCount.textContent=known.size;percent.textContent=Math.round(known.size/12*100)+'%';barFill.style.width=known.size/12*100+'%';streakText.textContent='探险连胜 🔥 '+streak}
function go(n){i=(n+words.length)%words.length;locked=false;render()}
function list(){return words.map((x,n)=>`<button class="${n===i?'current':''} ${known.has(x.w)?'done':''}" onclick="go(${n})">${x.w}<span>${x.zone}</span></button>`).join('')}
function story(){const x=words[i];return `<div class="missionTop"><div><span class="eyebrow">STORY ROUTE · ${x.zone}</span><h2>第 ${i+1} 个记忆坐标</h2><p>先读情境并猜词义，再翻开答案。</p></div><div class="zones"><span class="${i<3?'active':''}">调查站</span><span class="${i>=3&&i<6?'active':''}">生态谷</span><span class="${i>=6&&i<9?'active':''}">旧基地</span><span class="${i>=9?'active':''}">核心舱</span></div></div><div class="layout"><article class="card story"><div class="step"><span>MISSION ${String(i+1).padStart(2,'0')}</span><span>${x.pos} · 高价值词</span></div><div class="wordline"><div><h3>${x.w}</h3><p>${x.p}</p></div><button class="sound" aria-label="播放发音" onclick="speechSynthesis.speak(new SpeechSynthesisUtterance('${x.w}'))">♪</button></div><div class="scene"><small>记忆画面</small><p>${x.hook}</p></div><div class="example"><small>剧情中的线索</small><p>“${x.s.replace('___','_______')}”</p></div><button class="guess" onclick="this.style.display='none';document.querySelector('.answer').classList.add('show')">我猜到了，解锁答案 ↗</button><div class="answer"><div><small>核心词义</small><b>${x.cn}</b></div><div><small>构词钩子</small><p>${x.root}</p></div><div><small>阅读常见搭配</small><p>${x.col}</p></div></div><div class="actions"><button onclick="go(i+1)">还不牢，之后再来</button><button class="got" onclick="known.add('${x.w}');stats();go(i+1)">已收进记忆背包 ✓</button></div></article><aside class="card map"><h3>探险地图 · 12 个新词</h3><div class="wordList">${list()}</div><div class="tip">💡 教学提示：让学生先用动作解释画面，再说中文词义。动作会成为更强的记忆线索。</div></aside></div>`}
function quiz(){const x=words[i],opts=i%2?[x.w,x.wrong]:[x.wrong,x.w];return `<article class="card quiz"><span class="label">QUICK RECALL · 不许偷看词卡</span><h2>用 10 秒救活这句话</h2><div class="timer">10</div><p class="question">“${x.s}”</p><div class="choices">${opts.map(o=>`<button onclick="pick(this,'${o}')"><b>${o}</b><span>${o===x.w?x.cn:x.wrongCn}</span></button>`).join('')}</div><div class="feedback"><button onclick="go(i+1)">下一题 →</button><b id="feedbackTitle"></b><div id="feedbackBody"></div></div></article>`}
function boss(){const x=words[i];return `<article class="card boss"><div class="bossCopy"><span class="eyebrow">FINAL TASK · 教师投屏模式</span><h2>记忆 BOSS：<br>禁说中文描述赛</h2><p>两人一组。A 看到词后，只能用动作、例子、反义词或英文解释；B 在 30 秒内猜出单词。猜中后必须补出一个常见搭配，才算真正击败 BOSS。</p><ul class="rules"><li><b>01</b>不能说中文、不能拼字母</li><li><b>02</b>可以演画面，也可以说反义词</li><li><b>03</b>猜中后全班共同造句</li></ul></div><div class="bossCard"><small>BOSS WORD ${String(i+1).padStart(2,'0')}</small><h3>${x.w}</h3><p>${x.p}</p><button onclick="go(Math.floor(Math.random()*words.length))">随机召唤下一个 ↻</button></div></article>`}
function render(){app.innerHTML=mode==='story'?story():mode==='quiz'?quiz():boss();stats()}
function pick(el,choice){if(locked)return;locked=true;const x=words[i],right=choice===x.w;el.classList.add(right?'correct':'wrong');if(right){streak++;known.add(x.w);feedbackTitle.textContent='命中！主动回忆成功。';feedbackBody.textContent=x.w+'：'+x.hook}else{streak=0;feedbackTitle.textContent='差一点！这次错误正在帮你形成记忆。';feedbackBody.textContent='正确答案是 '+x.w+'（'+x.cn+'）。'+x.hook}document.querySelector('.feedback').classList.add('show');stats()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelector('.tabs .on').classList.remove('on');b.classList.add('on');mode=b.dataset.mode;locked=false;render()});render();
  </script>
</body>
</html>
