<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>剑桥雅思20词汇实验室 · Lesson 01</title><style>
:root{--g:#204f3d;--o:#ef875c;--cream:#f5f0e6;--ink:#14251f;--line:#d9ddd5}*{box-sizing:border-box}body{margin:0;background:#f8f6f0;color:var(--ink);font-family:Arial,"PingFang SC",sans-serif}button{font:inherit;cursor:pointer}.top{height:70px;padding:0 6vw;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.brand{font-weight:900;display:flex;align-items:center;gap:12px}.mark{width:42px;height:42px;background:var(--g);color:#fff;display:grid;place-items:center;border-radius:50% 50% 50% 12%;font-family:Georgia}.top a{color:var(--g);text-decoration:none;font-size:11px}.hero{background:var(--cream);padding:48px 7vw;display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:10px;letter-spacing:.18em;font-weight:900;color:var(--g)}h1{font:500 clamp(42px,6vw,70px)/1 Georgia,"Songti SC",serif;margin:15px 0}h1 em{color:var(--g)}.hero p{color:#6b766e;font-size:13px}.score{background:#fff;border:1px solid #e0ddd5;border-radius:16px;padding:22px 28px}.score b{font-size:28px}.score span{display:block;color:#7a847c;font-size:10px;margin-top:6px}.bar{height:6px;background:#e8ece5;border-radius:9px;margin-top:14px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--o);transition:.3s}.tabs{display:flex;padding:0 7vw;background:#fff;border-block:1px solid var(--line)}.tabs button{border:0;border-bottom:3px solid transparent;background:none;padding:18px 23px;color:#7a847c;font-size:11px;font-weight:900}.tabs .on{color:var(--g);border-color:var(--g)}main{max-width:1100px;margin:38px auto 70px;padding:0 22px}.grid{display:grid;grid-template-columns:250px 1fr;gap:22px}.panel{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 15px 40px #20382e0d}.list{padding:14px;height:650px;overflow:auto}.list h3{font-size:12px;padding:3px 6px 12px;margin:0}.list button{width:100%;border:0;border-bottom:1px solid #edf0eb;background:#fff;padding:11px;display:flex;justify-content:space-between;text-align:left;color:#667169}.list b{font:600 15px Georgia;color:var(--ink)}.list small{display:block;font-size:9px;margin-top:3px}.list button.active{background:#e9f4e7;border-radius:8px}.list button.done:after{content:'✓';color:var(--g);font-weight:900}.card{padding:34px 40px}.meta{display:flex;justify-content:space-between;color:#858e86;font-size:9px;letter-spacing:.13em}.wordline{display:flex;justify-content:space-between;align-items:center;margin:28px 0}.wordline h2{font:500 clamp(50px,8vw,78px)/1 Georgia;margin:0}.wordline p{font-size:12px;color:#7d887f}.sound{width:50px;height:50px;border-radius:50%;border:1px solid #ccd6cb;background:#f0f7ee;color:var(--g)}.hook{background:var(--g);color:#fff;border-radius:12px;padding:21px 23px}.hook small,.sentence small,.answer small{font-size:9px;letter-spacing:.14em;font-weight:900;opacity:.7}.hook p{font:18px/1.6 Georgia,"Songti SC",serif;margin:8px 0}.sentence{padding:21px 2px 15px}.sentence small{color:var(--g)}.sentence p{font:italic 20px/1.5 Georgia;margin:8px 0}.reveal{width:100%;padding:14px;border:1px dashed #aab6aa;background:#f7f9f5;border-radius:8px;color:var(--g);font-weight:900}.answer{display:none;grid-template-columns:.8fr 1.2fr 1.2fr;border:1px solid #dce3da;border-radius:9px;overflow:hidden}.answer.show{display:grid}.answer div{padding:14px;border-right:1px solid #dce3da}.answer div:last-child{border:0}.answer b{display:block;color:var(--o);margin-top:7px}.answer p{font-size:11px;line-height:1.5;margin:7px 0}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}.actions button{border:1px solid #d5ddd4;background:#fff;border-radius:8px;padding:10px 13px;font-size:10px;font-weight:900}.actions .yes{background:var(--g);color:#fff}.quiz,.teacher{padding:42px 48px}.quiz{text-align:center}.quiz h2,.teacher h2{font:500 38px Georgia,"Songti SC",serif}.question{background:var(--cream);border-left:4px solid var(--o);padding:25px;text-align:left;font:italic 25px/1.5 Georgia}.choices{display:grid;grid-template-columns:1fr 1fr;gap:13px}.choices button{text-align:left;border:1px solid #d8ded6;background:#fff;border-radius:11px;padding:19px}.choices b{font:21px Georgia}.choices span{display:block;font-size:10px;color:#7c867f;margin-top:5px}.choices .correct{background:#eaf6e9;border:2px solid #39805b}.choices .wrong{background:#fff0eb;border:2px solid #c55d46}.feedback{display:none;margin-top:16px;padding:16px;background:#edf6ec;border-radius:9px;text-align:left}.feedback.show{display:block}.feedback button{float:right;background:var(--g);color:#fff;border:0;border-radius:7px;padding:9px}.teacher{display:grid;grid-template-columns:1.3fr .8fr;gap:40px;align-items:center}.teacher p{line-height:1.8;color:#667168}.spot{background:var(--g);color:#fff;border-radius:18px;padding:48px 25px;text-align:center;box-shadow:10px 10px #cadfc5}.spot h3{font:40px Georgia;margin:25px}.spot button{border:1px solid #ffffff66;background:none;color:#fff;border-radius:20px;padding:10px 14px}footer{text-align:center;border-top:1px solid var(--line);padding:24px;color:#828c84;font-size:9px;letter-spacing:.12em}@media(max-width:720px){.hero{display:block}.score{margin-top:25px}.tabs{padding:0;overflow:auto}.tabs button{white-space:nowrap}.grid,.teacher{grid-template-columns:1fr}.list{height:auto;display:flex;overflow:auto}.list h3{display:none}.list button{min-width:130px}.card,.quiz,.teacher{padding:25px 20px}.answer,.choices{grid-template-columns:1fr}.answer div{border-right:0;border-bottom:1px solid #ddd}}
</style></head><body><header class="top"><div class="brand"><span class="mark">C20</span>词汇实验室</div><a href="../index.html">← 返回课程主页</a></header><section class="hero"><div><span class="eyebrow">LESSON 01 · 拒绝死记硬背</span><h1>先看懂一个故事，<br><em>再记住一个单词。</em></h1><p>情境画面 × 词根钩子 × 主动提取 × 即时反馈</p></div><div class="score"><b id="score">0 / 12</b><span id="streak">连续答对 🔥 0</span><div class="bar"><i id="fill"></i></div></div></section><nav class="tabs"><button class="on" data-mode="study">◫ 情境卡</button><button data-mode="quiz">⚡ 极速挑战</button><button data-mode="teacher">◉ 教师模式</button></nav><main id="app"></main><footer>CAMBRIDGE IELTS 20 · VOCABULARY LAB · LESSON 01</footer><script>
const W=[
['mitigate','/ˈmɪtɪɡeɪt/','v.','减轻；缓和','给火灾盖上一条湿毯：不能让火消失，但能让它变小。','mitis（柔和）→ 把严重程度变柔和','Planting more trees can ___ the effects of urban heat.','mitigate the impact / risk / damage','eliminate','彻底消除'],
['exacerbate','/ɪɡˈzæsəbeɪt/','v.','使恶化；加剧','伤口上又撒盐——问题不但没解决，反而更糟。','ex-（向外）+ acer（尖锐）','A lack of sleep may ___ feelings of anxiety.','exacerbate a problem / inequality','alleviate','缓解'],
['plausible','/ˈplɔːzəbəl/','adj.','看似合理的；可信的','听完解释会点头说“有可能”，但它还没有被证实。','plaus（鼓掌）→ 听起来值得认可','Researchers offered a ___ explanation for the result.','a plausible explanation / theory','proven','已证实的'],
['empirical','/ɪmˈpɪrɪkəl/','adj.','以观察或实验为依据的','别只说“我觉得”，拿实验数据和真实观察来。','experience（经验）同源','The claim must be supported by ___ evidence.','empirical evidence / research / data','anecdotal','轶事性的'],
['ubiquitous','/juːˈbɪkwɪtəs/','adj.','无处不在的','像手机一样：教室、地铁、餐桌，到处都能看到。','ubi（哪里）→ 每一个哪里都有','Smartphones have become ___ in modern life.','become increasingly ubiquitous','scarce','稀少的'],
['detrimental','/ˌdetrɪˈmentəl/','adj.','有害的；不利的','它不是立刻摧毁你，而是悄悄扣掉健康分。','detriment（损害）+ -al','Screen time can be ___ to sleep quality.','be detrimental to health / growth','beneficial','有益的'],
['resilient','/rɪˈzɪliənt/','adj.','有韧性的；能恢复的','像被压弯的弹簧：受过压力，仍能弹回来。','re-（回来）+ salire（跳）','Some ecosystems are ___ after disasters.','a resilient community / ecosystem','fragile','脆弱的'],
['unprecedented','/ʌnˈpresɪdentɪd/','adj.','前所未有的','历史记录翻到底：以前一次都没有。','un-（不）+ precedent（先例）','The city grew on an ___ scale.','an unprecedented level / rate','conventional','常规的'],
['allocate','/ˈæləkeɪt/','v.','分配；划拨','老师把有限时间、座位和任务分给不同小组。','loc（位置）→ 给资源安排位置','The government will ___ funds to education.','allocate resources / funds / time','accumulate','积累'],
['intricate','/ˈɪntrɪkət/','adj.','错综复杂的；精细的','耳机线在口袋里打成一百个结：细节多、关系复杂。','intricare（缠结）','The temple has ___ stone carvings.','an intricate pattern / system','straightforward','简单明了的'],
['discern','/dɪˈsɜːn/','v.','辨别；察觉','雾里看轮廓：不是一眼看清，而是仔细分辨出来。','dis-（分开）+ cern（筛选）','It is hard to ___ a pattern in the data.','discern a difference / pattern','conceal','隐藏'],
['inhibit','/ɪnˈhɪbɪt/','v.','抑制；阻碍','像踩住自行车刹车：它还能动，但被限制了。','in-（在内）+ habere（持有）','Low temperatures ___ bacterial growth.','inhibit growth / development','stimulate','促进']];
let i=0,mode='study',known=new Set(),st=0,locked=false;const app=document.querySelector('#app');function stats(){score.textContent=`${known.size} / 12`;streak.textContent=`连续答对 🔥 ${st}`;fill.style.width=known.size/12*100+'%'}function go(n){i=(n+12)%12;locked=false;render()}function study(){let x=W[i];return `<div class="grid"><aside class="panel list"><h3>今日词单 · 12 WORDS</h3>${W.map((w,n)=>`<button class="${n===i?'active':''} ${known.has(w[0])?'done':''}" onclick="go(${n})"><span><b>${w[0]}</b><small>${w[2]} · 高价值词</small></span></button>`).join('')}</aside><article class="panel card"><div class="meta"><span>情境记忆卡</span><span>${String(i+1).padStart(2,'0')} / 12</span></div><div class="wordline"><div><h2>${x[0]}</h2><p>${x[1]} · ${x[2]}</p></div><button class="sound" onclick="speechSynthesis.speak(new SpeechSynthesisUtterance('${x[0]}'))">♪</button></div><div class="hook"><small>画面钩子</small><p>${x[4]}</p></div><div class="sentence"><small>放回句子</small><p>“${x[6].replace('___','_______')}”</p></div><button class="reveal" onclick="this.style.display='none';document.querySelector('.answer').classList.add('show')">我猜好了，翻开答案 ↗</button><div class="answer"><div><small>核心词义</small><b>${x[3]}</b></div><div><small>词根钩子</small><p>${x[5]}</p></div><div><small>常见搭配</small><p>${x[7]}</p></div></div><div class="actions"><button onclick="go(i+1)">之后再遇一次</button><button class="yes" onclick="known.add('${x[0]}');stats();go(i+1)">记住了 ✓</button></div></article></div>`}function quiz(){let x=W[i],a=i%2?[x[0],x[8]]:[x[8],x[0]];return `<article class="panel quiz"><span class="eyebrow">10 秒主动提取</span><h2>哪一个词最适合填空？</h2><p class="question">“${x[6]}”</p><div class="choices">${a.map(v=>`<button onclick="pick(this,'${v}')"><b>${v}</b><span>${v===x[0]?x[3]:x[9]}</span></button>`).join('')}</div><div class="feedback"><button onclick="go(i+1)">下一题 →</button><b id="fb"></b><p>${x[4]}</p></div></article>`}function teacher(){let x=W[i];return `<article class="panel teacher"><div><span class="eyebrow">投屏小游戏 · 3 分钟</span><h2>“禁说中文”描述赛</h2><p>两人一组。A 只能用英语、动作、反义词或例子描述，不能说中文和词本身；B 在 30 秒内猜词。猜中后补出一个阅读搭配。</p><ol><li>先演记忆画面</li><li>再说反义词或使用场景</li><li>最后全班共同造句</li></ol></div><div class="spot"><small>本轮词汇</small><h3>${x[0]}</h3><p>${x[1]}</p><button onclick="go(Math.floor(Math.random()*12))">随机换词 ↻</button></div></article>`}function pick(el,v){if(locked)return;locked=true;let x=W[i],ok=v===x[0];el.classList.add(ok?'correct':'wrong');if(ok){known.add(x[0]);st++;fb.textContent='命中！大脑完成了一次主动提取。'}else{st=0;fb.textContent=`正确答案：${x[0]}（${x[3]}）`}document.querySelector('.feedback').classList.add('show');stats()}function render(){app.innerHTML=mode==='study'?study():mode==='quiz'?quiz():teacher();stats()}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelector('.tabs .on').classList.remove('on');b.classList.add('on');mode=b.dataset.mode;locked=false;render()});render();
</script></body></html>
