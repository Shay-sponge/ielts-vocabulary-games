  <style>
    :root{--night:#17223b;--purple:#7357d6;--violet:#ece8ff;--sun:#ffc857;--paper:#fbfaf6;--ink:#17223b;--muted:#697188;--line:#dde0e8;--good:#24966d;--bad:#d95757}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,Arial,"PingFang SC",sans-serif}button{font:inherit;cursor:pointer}.top{height:68px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;background:var(--night);color:#fff}.brand{display:flex;align-items:center;gap:11px;font-weight:900}.logo{width:41px;height:41px;display:grid;place-items:center;border:2px solid var(--sun);border-radius:12px;transform:rotate(-3deg);color:var(--sun);font-family:Georgia,serif}.topActions{display:flex;align-items:center;gap:18px}.top small{color:#bfc6dc;letter-spacing:.14em}.top a{color:#fff;text-decoration:none;font-size:11px;font-weight:800}.top a:hover{text-decoration:underline}.hero{background:var(--night);color:#fff;padding:46px 7vw 52px;display:grid;grid-template-columns:1.4fr .8fr;gap:35px;align-items:center;position:relative;overflow:hidden}.hero:after{content:"04";position:absolute;right:4vw;bottom:-60px;color:#ffffff08;font:900 220px Arial}.eyebrow{color:var(--sun);font-size:10px;letter-spacing:.18em;font-weight:900}.hero h1{font:500 clamp(39px,5.7vw,72px)/.98 Georgia,"Songti SC",serif;margin:15px 0}.hero h1 em{color:var(--sun)}.hero p{color:#c6ccdc;font-size:13px;line-height:1.7}.progressBox{position:relative;z-index:1;border:1px solid #ffffff2e;background:#ffffff0d;border-radius:18px;padding:23px}.progressBox>div:first-child{display:flex;justify-content:space-between;align-items:end}.progressBox strong{font-size:31px;color:var(--sun)}.progressBox span{font-size:10px;color:#bac2d5}.bar{height:7px;background:#ffffff1c;border-radius:10px;margin:16px 0 9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--sun);transition:.3s}.progressBox small{font-size:10px;color:#c8cedd}.tabs{display:flex;justify-content:center;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.tabs button{border:0;border-bottom:3px solid transparent;background:#fff;padding:18px 27px;color:#777f94;font-size:12px;font-weight:800}.tabs button.on{color:var(--purple);border-color:var(--purple)}main{max-width:1120px;margin:38px auto 65px;padding:0 22px}.missionTop{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.missionTop h2{font:500 30px Georgia,"Songti SC",serif;margin:6px 0}.missionTop p{margin:0;color:var(--muted);font-size:12px}.zones{display:flex;gap:7px}.zones span{padding:7px 10px;border-radius:20px;background:#eceef3;color:#7c8499;font-size:9px;font-weight:800}.zones .active{background:var(--violet);color:var(--purple)}.layout{display:grid;grid-template-columns:1fr 280px;gap:22px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 16px 45px #17223b0c;overflow:hidden}.story{padding:34px 39px}.step{display:flex;justify-content:space-between;color:#8a91a3;font-size:9px;letter-spacing:.14em;font-weight:900}.wordline{display:flex;justify-content:space-between;align-items:center;margin:27px 0 22px}.wordline h3{font:500 clamp(45px,7vw,72px)/1 Georgia,serif;margin:0;letter-spacing:-.03em}.wordline p{margin:8px 0 0;color:#858da1;font-size:12px}.sound{border:1px solid #d7d2f4;background:var(--violet);color:var(--purple);width:50px;height:50px;border-radius:50%;font-weight:bold}.scene{background:var(--night);color:#fff;padding:21px 23px;border-radius:12px;position:relative}.scene:before{content:"剧情";position:absolute;right:14px;top:12px;font-size:9px;letter-spacing:.15em;color:#ffffff60}.scene small,.example small,.memory small{font-size:9px;letter-spacing:.13em;font-weight:900;color:var(--sun)}.scene p{font:18px/1.65 Georgia,"Songti SC",serif;margin:9px 0 0}.example{padding:22px 2px 14px}.example small{color:var(--purple)}.example p{font:italic 19px/1.5 Georgia,serif;margin:8px 0}.guess{width:100%;border:1px dashed #aca4dc;background:#f8f6ff;border-radius:9px;padding:15px;color:var(--purple);font-weight:900;font-size:12px}.answer{display:none;grid-template-columns:.8fr 1.3fr 1.2fr;border:1px solid #ddd9f0;border-radius:10px;overflow:hidden}.answer.show{display:grid}.answer>div{padding:14px 16px;border-right:1px solid #ddd9f0}.answer>div:last-child{border:0}.answer small{display:block;color:#8d849f;font-size:9px;letter-spacing:.1em}.answer b{display:block;color:var(--purple);font-size:17px;margin-top:7px}.answer p{font-size:11px;line-height:1.55;margin:7px 0 0}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}.actions button{padding:11px 14px;border:1px solid #d8dbe4;background:#fff;border-radius:8px;font-size:10px;font-weight:800;color:#71798d}.actions .got{background:var(--purple);color:white;border-color:var(--purple)}.map{padding:19px;height:max-content}.map h3{font-size:12px;margin:0 0 16px}.wordList{display:grid;grid-template-columns:1fr 1fr;gap:7px}.wordList button{border:1px solid #e1e3ea;background:#fff;border-radius:9px;padding:10px 9px;text-align:left;color:#586078;font:600 12px Georgia}.wordList button span{display:block;font:9px Arial;color:#9aa0b0;margin-top:3px}.wordList button.current{background:var(--night);color:#fff;border-color:var(--night)}.wordList button.done:after{content:" ✓";color:var(--good)}.tip{margin-top:16px;background:#fff6dd;padding:13px;border-radius:9px;font-size:10px;line-height:1.6;color:#71633d}.quiz{padding:42px 48px;text-align:center}.quiz .label{font-size:9px;letter-spacing:.18em;font-weight:900;color:var(--purple)}.quiz h2{font:500 34px Georgia,"Songti SC",serif;margin:13px}.timer{width:46px;height:46px;display:grid;place-items:center;margin:20px auto;border-radius:50%;background:var(--night);color:var(--sun);font-weight:900}.question{background:#f0edff;border-left:4px solid var(--purple);padding:24px 27px;text-align:left;font:italic 24px/1.55 Georgia,serif}.choices{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:18px}.choices button{text-align:left;border:1px solid #dce0e8;background:#fff;padding:19px 20px;border-radius:11px}.choices b{font:600 20px Georgia}.choices span{display:block;color:#7b8396;font-size:10px;margin-top:5px}.choices .correct{border:2px solid var(--good);background:#eaf8f2}.choices .wrong{border:2px solid var(--bad);background:#fff0f0}.feedback{display:none;margin-top:17px;padding:16px 18px;background:#eef8f3;border-radius:9px;text-align:left;font-size:12px;line-height:1.6}.feedback.show{display:block}.feedback button{float:right;border:0;background:var(--night);color:#fff;border-radius:7px;padding:9px 13px}.boss{display:grid;grid-template-columns:1fr .9fr;gap:28px;padding:35px}.bossCopy{padding:15px}.boss h2{font:500 42px Georgia,"Songti SC",serif;margin:12px 0}.boss p{line-height:1.75;color:#687087;font-size:13px}.rules{padding:0;list-style:none}.rules li{display:flex;gap:12px;border-top:1px solid var(--line);padding:13px 0;font-size:11px}.rules b{color:var(--purple)}.bossCard{background:linear-gradient(145deg,#6e54d5,#382879);color:#fff;border-radius:18px;padding:35px 25px;text-align:center;box-shadow:10px 11px #dcd5ff}.bossCard small{letter-spacing:.15em;color:#d8d0ff}.bossCard h3{font:500 40px Georgia;margin:30px 0 8px}.bossCard p{color:#ddd7f7;font-size:11px}.bossCard button{margin-top:25px;border:1px solid #ffffff65;background:#ffffff12;color:#fff;border-radius:25px;padding:11px 17px}footer{text-align:center;padding:24px;border-top:1px solid var(--line);color:#858ca0;font-size:9px;letter-spacing:.12em}@media(max-width:760px){.top small{display:none}.hero{grid-template-columns:1fr;padding:36px 24px}.tabs{justify-content:flex-start;overflow:auto}.tabs button{white-space:nowrap}.layout,.boss{grid-template-columns:1fr}.missionTop{display:block}.zones{margin-top:13px}.story,.quiz{padding:25px 21px}.map{order:-1}.wordList{display:flex;overflow:auto}.wordList button{min-width:105px}.answer,.choices{grid-template-columns:1fr}.answer>div{border-right:0;border-bottom:1px solid #ddd9f0}.question{font-size:20px}}
  </style>

    @media(max-width:760px){.wordline{gap:12px;align-items:flex-start}.wordline h3{font-size:clamp(28px,10vw,45px);overflow-wrap:anywhere}.sound{flex:0 0 50px}.actions{flex-wrap:wrap}}

<body>
  <header class="top"><div class="brand"><span class="logo">C20</span><span>词汇记忆探险</span></div><div class="topActions"><small>LESSON 04 · 16 TARGET WORDS</small><a href="../index.html">← 返回课程主页</a></div></header>
  <section class="hero"><div><span class="eyebrow">LESSON 04 · 16 个目标词 · 完整新版</span><h1>雅思阅读高价值词汇<br><em>互动记忆训练</em></h1><p>本课词库共 16 个单词；本次版本新增的 4 个是 empirical、pervasive、ambiguous、rigorous。学生通过记忆画面、阅读例句、词根钩子、快速选择和课堂描述赛来反复提取词义。</p></div><div class="progressBox"><div><div><strong id="knownCount">0</strong><span id="totalWordsLabel"> / 16 WORDS</span></div><span id="percent">0%</span></div><div class="bar"><i id="barFill"></i></div><small id="streakText">任务连胜 🔥 0</small></div></section>
  <nav class="tabs"><button class="on" data-mode="story">🗺 剧情路线</button><button data-mode="quiz">⚡ 反应挑战</button><button data-mode="boss">♛ BOSS BATTLE</button></nav>
  <main id="app"></main><footer>CAMBRIDGE IELTS 20 · VOCABULARY LAB　|　LESSON 04 · 16 个高价值词</footer>
  <script>
const words=[
{w:'corroborate',p:'/kəˈrɒbəreɪt/',pos:'v.',cn:'证实；提供支持证据',zone:'证据室',hook:'一个证人的话还不够，第二份录像出现后，两个证据互相“证实”。',root:'cor-（共同）+ robur（力量）→ 共同加强证据',s:'Later observations helped to ___ the original findings.',col:'corroborate a claim / account / evidence',wrong:'contradict',wrongCn:'反驳；与……矛盾'},
{w:'negligible',p:'/ˈneɡlɪdʒəbəl/',pos:'adj.',cn:'微不足道的；可忽略的',zone:'证据室',hook:'天平上落下一粒灰尘，指针几乎不动——小到可以忽略。',root:'neglect（忽略）+ -ible（可以……的）',s:'The difference between the two groups was statistically ___.',col:'a negligible effect / amount / difference',wrong:'considerable',wrongCn:'相当大的'},
{w:'delineate',p:'/dɪˈlɪnieɪt/',pos:'v.',cn:'勾画；明确说明',zone:'证据室',hook:'研究员用亮色笔沿地图边界一笔划过，把范围清楚地勾出来。',root:'de-（完全）+ line（线）→ 用线清楚描出',s:'The report clearly ___ the limits of the experiment.',col:'delineate a boundary / role / difference',wrong:'obscure',wrongCn:'使模糊；掩盖'},
{w:'mitigate',p:'/ˈmɪtɪɡeɪt/',pos:'v.',cn:'减轻；缓和',zone:'理解区',hook:'暴雨无法立刻停止，但防洪墙让灾害从巨浪变成小水流。',root:'mitis（温和）→ 使严重程度变温和',s:'Planting trees can help ___ the effects of urban heat.',col:'mitigate the risk / impact / damage',wrong:'aggravate',wrongCn:'加重；恶化'},
{w:'sporadic',p:'/spəˈrædɪk/',pos:'adj.',cn:'零星的；偶发的',zone:'理解区',hook:'整张夜空只有几颗灯偶尔闪一下，不连续、也没有固定规律。',root:'sporadikos（分散的）→ 零星出现',s:'The disease occurred in ___ outbreaks across the region.',col:'sporadic outbreaks / reports / contact',wrong:'continuous',wrongCn:'连续不断的'},
{w:'substantiate',p:'/səbˈstænʃieɪt/',pos:'v.',cn:'证明；使有事实根据',zone:'理解区',hook:'一个空心说法被塞进数据、图表和记录后，终于变得“有实体”。',root:'substance（实质）+ -ate → 赋予事实基础',s:'The author failed to ___ the claim with reliable data.',col:'substantiate a claim / allegation / theory',wrong:'speculate',wrongCn:'推测'},
{w:'unprecedented',p:'/ʌnˈpresɪdentɪd/',pos:'adj.',cn:'前所未有的',zone:'数据塔',hook:'从第一页翻到最后一页，都找不到任何一次相同记录。',root:'un-（没有）+ precedent（先例）+ -ed',s:'The city experienced an ___ rise in summer temperatures.',col:'unprecedented growth / change / demand',wrong:'ordinary',wrongCn:'普通的'},
{w:'discrepancy',p:'/dɪˈskrepənsi/',pos:'n.',cn:'差异；不一致',zone:'数据塔',hook:'两台仪器测同一个物体，却显示两个数字，红灯提示“结果不一致”。',root:'discrepare（发出不同声音）→ 不一致',s:'Researchers found a ___ between the two sets of results.',col:'a discrepancy between / explain a discrepancy',wrong:'agreement',wrongCn:'一致'},
{w:'exhaustive',p:'/ɪɡˈzɔːstɪv/',pos:'adj.',cn:'详尽的；彻底的',zone:'数据塔',hook:'搜索队翻完每个抽屉、每个文件夹，直到没有任何遗漏。',root:'exhaust（用尽）+ -ive → 穷尽所有可能',s:'The team conducted an ___ review of previous studies.',col:'an exhaustive search / study / list',wrong:'partial',wrongCn:'部分的'},
{w:'counterintuitive',p:'/ˌkaʊntərɪnˈtjuːɪtɪv/',pos:'adj.',cn:'违反直觉的',zone:'推理舱',hook:'按钮写着“向上”，按下后电梯却下降——结果与第一直觉相反。',root:'counter-（相反）+ intuitive（直觉的）',s:'The experiment produced a ___ result that surprised experts.',col:'a counterintuitive result / finding / idea',wrong:'predictable',wrongCn:'可预测的'},
{w:'deteriorate',p:'/dɪˈtɪəriəreɪt/',pos:'v.',cn:'恶化；退化',zone:'推理舱',hook:'一张清晰照片逐渐褪色、开裂，状态一步步变差。',root:'deterior（较差的）+ -ate → 变得更差',s:'Air quality began to ___ as traffic increased.',col:'conditions / health / quality deteriorate',wrong:'improve',wrongCn:'改善'},
{w:'constraint',p:'/kənˈstreɪnt/',pos:'n.',cn:'限制；约束条件',zone:'推理舱',hook:'机器人本来能向四面走，却被一圈绳子限制在规定范围内。',root:'con-（共同）+ stringere（拉紧）→ 用力束缚',s:'Limited funding was a major ___ on the research project.',col:'a financial / time / practical constraint',wrong:'freedom',wrongCn:'自由'},
{w:'empirical',p:'/ɪmˈpɪrɪkəl/',pos:'adj.',cn:'以观察或实验为依据的；实证的',zone:'推理舱',hook:'不靠猜，研究员把温度计、问卷和实验记录摆上桌，用真实数据说话。',root:'empiric（经验、观察）+ -al → 基于观察经验的',s:'The theory is supported by ___ evidence from field studies.',col:'empirical evidence / research / data',wrong:'theoretical',wrongCn:'理论上的'},
{w:'pervasive',p:'/pərˈveɪsɪv/',pos:'adj.',cn:'到处存在的；普遍弥漫的',zone:'推理舱',hook:'一滴墨水落进清水，颜色慢慢扩散到每个角落。',root:'per-（贯穿）+ vadere（走）→ 走遍每处',s:'Digital technology has become ___ in modern classrooms.',col:'a pervasive influence / problem / presence',wrong:'rare',wrongCn:'罕见的'},
{w:'ambiguous',p:'/æmˈbɪɡjuəs/',pos:'adj.',cn:'模棱两可的；含糊的',zone:'推理舱',hook:'路牌同时指向左右两边，学生站在中间不知道该往哪走。',root:'ambi-（两边）+ agere（驱动）→ 可往两边解释',s:'The wording of the question was ___ and confused many participants.',col:'ambiguous wording / meaning / results',wrong:'explicit',wrongCn:'明确的'},
{w:'rigorous',p:'/ˈrɪɡərəs/',pos:'adj.',cn:'严谨的；严格的',zone:'推理舱',hook:'老师拿着放大镜检查每一步计算，任何跳步都要补证据。',root:'rigor（严格、严密）+ -ous → 充满严格要求的',s:'A ___ method is essential if the results are to be trusted.',col:'rigorous analysis / testing / standards',wrong:'careless',wrongCn:'粗心的'}];
let i=0,mode='story',known=new Set(),streak=0,locked=false;const app=document.querySelector('#app');
function stats(){knownCount.textContent=known.size;totalWordsLabel.textContent=' / '+words.length+' WORDS';percent.textContent=Math.round(known.size/words.length*100)+'%';barFill.style.width=known.size/words.length*100+'%';streakText.textContent='任务连胜 🔥 '+streak}
function go(n){i=(n+words.length)%words.length;locked=false;render()}
function list(){return words.map((x,n)=>`<button class="${n===i?'current':''} ${known.has(x.w)?'done':''}" onclick="go(${n})">${x.w}<span>${x.zone}</span></button>`).join('')}
function story(){const x=words[i];return `<div class="missionTop"><div><span class="eyebrow">WORD TRAINING · ${x.zone}</span><h2>第 ${i+1} 个任务词</h2><p>先读情境并猜词义，再翻开答案。</p></div><div class="zones"><span class="${x.zone==='证据室'?'active':''}">证据室</span><span class="${x.zone==='理解区'?'active':''}">理解区</span><span class="${x.zone==='数据塔'?'active':''}">数据塔</span><span class="${x.zone==='推理舱'?'active':''}">推理舱</span></div></div><div class="layout"><article class="card story"><div class="step"><span>WORD ${String(i+1).padStart(2,'0')} / ${words.length}</span><span>${x.pos} · 高价值词</span></div><div class="wordline"><div><h3>${x.w}</h3><p>${x.p}</p></div><button class="sound" aria-label="播放发音" onclick="speechSynthesis.speak(new SpeechSynthesisUtterance('${x.w}'))">♪</button></div><div class="scene"><small>记忆画面</small><p>${x.hook}</p></div><div class="example"><small>阅读例句</small><p>“${x.s.replace('___','_______')}”</p></div><button class="guess" onclick="this.style.display='none';document.querySelector('.answer').classList.add('show')">我猜到了，查看答案 ↗</button><div class="answer"><div><small>核心词义</small><b>${x.cn}</b></div><div><small>构词钩子</small><p>${x.root}</p></div><div><small>阅读常见搭配</small><p>${x.col}</p></div></div><div class="actions"><button onclick="go(i+1)">还不牢，之后再来</button><button class="got" onclick="known.add('${x.w}');stats();go(i+1)">已写入长期记忆 ✓</button></div></article><aside class="card map"><h3>任务词地图 · ${words.length} 个目标词</h3><div class="wordList">${list()}</div><div class="tip">💡 教学提示：先让学生表演记忆画面，再说中文词义；动作和夸张画面比重复抄写更容易留下线索。</div></aside></div>`}
function quiz(){const x=words[i],opts=i%2?[x.w,x.wrong]:[x.wrong,x.w];return `<article class="card quiz"><span class="label">QUICK RECALL · 不许偷看词卡</span><h2>用 10 秒救活这句话</h2><div class="timer">10</div><p class="question">“${x.s}”</p><div class="choices">${opts.map(o=>`<button onclick="pick(this,'${o}')"><b>${o}</b><span>${o===x.w?x.cn:x.wrongCn}</span></button>`).join('')}</div><div class="feedback"><button onclick="go(i+1)">下一题 →</button><b id="feedbackTitle"></b><div id="feedbackBody"></div></div></article>`}
function boss(){const x=words[i];return `<article class="card boss"><div class="bossCopy"><span class="eyebrow">FINAL TASK · 教师投屏模式</span><h2>记忆 BOSS：<br>禁说中文描述赛</h2><p>两人一组。A 看到词后，只能用动作、例子、反义词或英文解释；B 在 30 秒内猜出单词。猜中后必须补出一个常见搭配，才算真正击败 BOSS。</p><ul class="rules"><li><b>01</b>不能说中文、不能拼字母</li><li><b>02</b>可以演画面，也可以说反义词</li><li><b>03</b>猜中后全班共同造句</li></ul></div><div class="bossCard"><small>BOSS WORD ${String(i+1).padStart(2,'0')}</small><h3>${x.w}</h3><p>${x.p}</p><button onclick="go(Math.floor(Math.random()*words.length))">随机召唤下一个 ↻</button></div></article>`}
function render(){app.innerHTML=mode==='story'?story():mode==='quiz'?quiz():boss();stats()}
function pick(el,choice){if(locked)return;locked=true;const x=words[i],right=choice===x.w;el.classList.add(right?'correct':'wrong');if(right){streak++;known.add(x.w);feedbackTitle.textContent='命中！主动回忆成功。';feedbackBody.textContent=x.w+'：'+x.hook}else{streak=0;feedbackTitle.textContent='差一点！这次错误正在帮你形成记忆。';feedbackBody.textContent='正确答案是 '+x.w+'（'+x.cn+'）。'+x.hook}document.querySelector('.feedback').classList.add('show');stats()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelector('.tabs .on').classList.remove('on');b.classList.add('on');mode=b.dataset.mode;locked=false;render()});render();
  </script>
</body>
