<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IELTS 19 高难词汇 · Lesson 07</title><style>
:root{--n:#101b33;--p:#7156d9;--g:#ffc857;--bg:#f7f5ef;--ink:#17213a;--line:#dddfe7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"PingFang SC",sans-serif}button{font:inherit;cursor:pointer}.top{padding:16px 6vw;background:var(--n);color:#fff;display:flex;justify-content:space-between;align-items:center}.top b{color:var(--g)}.topActions{display:flex;align-items:center;gap:18px;font-size:10px;letter-spacing:.08em}.top a{color:#fff;text-decoration:none;font-weight:800}.top a:hover{text-decoration:underline}.hero{padding:38px 7vw;background:var(--n);color:white;display:grid;grid-template-columns:1.5fr .7fr;gap:28px}.hero h1{font:500 clamp(40px,6vw,70px)/1 Georgia,serif;margin:10px 0}.hero em{color:var(--g);font-style:normal}.hero p{color:#c7ccda}.progress{border:1px solid #ffffff35;border-radius:16px;padding:22px}.progress strong{font-size:34px;color:var(--g)}.bar{height:7px;background:#ffffff1c;border-radius:8px;margin:15px 0;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--g);transition:.3s}.tabs{display:flex;justify-content:center;background:#fff;position:sticky;top:0;z-index:2;border-bottom:1px solid var(--line)}.tabs button{border:0;border-bottom:3px solid transparent;background:#fff;padding:17px 28px;font-weight:800;color:#747b8d}.tabs .on{color:var(--p);border-color:var(--p)}main{max-width:1080px;margin:32px auto 60px;padding:0 20px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:20px}.grid>*{min-width:0}.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 16px 42px #17213a0d}.lesson{padding:32px 38px}.meta{display:flex;justify-content:space-between;color:#888fa0;font-size:10px;font-weight:800}.word{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:24px 0}.word>div{min-width:0}.word h2{font:500 clamp(44px,7vw,70px)/1 Georgia;margin:0}.phon{color:#7d8598;margin-top:8px}.sound{width:50px;height:50px;border:1px solid #d7d0f8;border-radius:50%;background:#efebff;color:var(--p)}.scene{background:var(--n);color:#fff;padding:20px 22px;border-radius:12px}.scene small,.example small{color:var(--g);font-size:9px;letter-spacing:.15em;font-weight:900}.scene p{font:18px/1.6 Georgia,"Songti SC",serif}.example{padding:19px 2px}.example small{color:var(--p)}.example p{font:italic 19px/1.5 Georgia}.reveal{width:100%;padding:14px;border:1px dashed #aaa0dc;border-radius:9px;background:#f8f6ff;color:var(--p);font-weight:900}.answer{display:none;margin-top:12px;padding:17px;background:#efecff;border-radius:9px}.answer.show{display:block}.answer b{color:var(--p);font-size:20px}.answer p{font-size:12px}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.actions button{padding:10px 13px;border:1px solid var(--line);border-radius:8px;background:#fff}.actions .got{background:var(--p);color:#fff}.map{padding:18px}.list{display:grid;grid-template-columns:1fr 1fr;gap:7px}.list button{padding:9px;border:1px solid var(--line);border-radius:8px;background:#fff;text-align:left;font:600 12px Georgia}.list .on{background:var(--n);color:#fff}.list .done:after{content:' ✓';color:#27aa78}.tip{margin-top:14px;background:#fff3c9;padding:12px;border-radius:8px;font-size:10px;line-height:1.6}.quiz,.boss{padding:38px;text-align:center}.quiz h2,.boss h2{font:500 38px Georgia}.question{background:#efecff;border-left:4px solid var(--p);padding:22px;text-align:left;font:italic 23px/1.5 Georgia}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.choices button{padding:17px;border:1px solid var(--line);border-radius:9px;background:#fff;text-align:left}.choices .correct{border:2px solid #19865f;background:#e8f7ef}.choices .wrong{border:2px solid #c64f54;background:#fff0f0}.feedback{display:none;margin-top:14px;padding:15px;background:#e8f7ef;border-radius:9px}.feedback.show{display:block}.bossword{max-width:560px;margin:25px auto;padding:40px;border-radius:18px;background:linear-gradient(145deg,#7357d7,#34256d);color:white;box-shadow:10px 10px #ddd6ff}.bossword strong{font:500 47px Georgia}.bossword button{border:1px solid #ffffff77;border-radius:20px;background:#ffffff18;color:#fff;padding:10px 16px}footer{text-align:center;padding:22px;border-top:1px solid var(--line);font-size:10px;color:#858c9b}@media(max-width:740px){.topActions span{display:none}.hero,.grid{grid-template-columns:minmax(0,1fr)}.hero{padding:30px 22px}.tabs{overflow:auto;justify-content:flex-start}.tabs button{white-space:nowrap}.lesson,.quiz,.boss{padding:23px 19px}.word{gap:12px}.word h2{font-size:clamp(34px,11vw,44px);overflow-wrap:anywhere}.map{order:-1}.list{display:flex;overflow:auto}.list button{min-width:105px}.choices{grid-template-columns:1fr}}
</style></head><body><header class="top"><b>◈ C19 词汇实验室</b><div class="topActions"><span>LESSON 07 · 16 TARGET WORDS</span><a href="../index.html">← 返回课程主页</a></div></header><section class="hero"><div><small>IELTS 19 · READING VOCABULARY</small><h1>Lesson 07<br><em>高难词汇挑战</em></h1><p>16 个雅思高价值词：先看情境猜意思，再主动提取，不靠机械抄写。</p></div><div class="progress"><strong id="count">0</strong> / 16 WORDS<div class="bar"><i id="fill"></i></div><small id="status">掌握进度 0%</small></div></section><nav class="tabs"><button class="on" data-m="learn">🧠 情境词卡</button><button data-m="quiz">⚡ 例句挑战</button><button data-m="boss">♛ BOSS BATTLE</button></nav><main id="app"></main><footer>IELTS 19 · VOCABULARY LAB | LESSON 07 · 16 WORDS</footer><script>
const W=[
['ingenious','adj.','巧妙的；有独创性的','工程师只用一根绳和两个轮子，就把巨石轻松吊起。','genius（天才）→ 像天才般巧妙','The researchers developed an ___ solution to the storage problem.','ordinary','普通的'],
['rudimentary','adj.','初步的；基本的；简陋的','第一代机器只有按钮和灯，功能非常基础。','rudiment（基础、雏形）+ -ary','Early navigation systems were extremely ___.','sophisticated','复杂精密的'],
['contentious','adj.','有争议的；引起争论的','一个观点刚写上黑板，全班立刻分成两派。','contend（争论）+ -ious','The proposal remains a highly ___ issue.','uncontroversial','无争议的'],
['proliferate','v.','迅速增殖；激增','一株小植物一夜之间长满整个温室。','proles（后代）→ 大量繁殖扩散','Online learning platforms began to ___ rapidly.','decline','减少'],
['rectify','v.','纠正；修正','红色警报指出错误，技术员立刻把歪线调正。','rect（直、正确）+ -ify（使）','Further tests were conducted to ___ the error.','preserve','保留原状'],
['discernible','adj.','可辨别的；看得出的','浓雾里灯塔只露出一点轮廓，但仍能被看见。','discern（辨别）+ -ible（可以）','There was no ___ difference between the samples.','invisible','看不见的'],
['inadvertent','adj.','无意的；疏忽造成的','手肘不小心碰到开关，机器意外启动。','in-（不）+ advert（注意）','The data loss was caused by an ___ mistake.','deliberate','故意的'],
['exacerbate','v.','使恶化；加剧','小火没有扑灭，强风一吹，火势反而更大。','exacerb（使严重）+ -ate','Heavy traffic may ___ existing pollution.','alleviate','减轻'],
['ubiquitous','adj.','无处不在的','从教室到地铁，每个人手里都有智能手机。','ubique（到处）+ -ous','Digital devices have become ___ in daily life.','scarce','稀少的'],
['autonomous','adj.','自主的；自治的','机器人没有遥控器，也能自己规划路线。','auto（自己）+ nomos（规则）','The vehicle can operate in fully ___ mode.','dependent','依赖的'],
['conjecture','n./v.','推测；猜想','证据还没齐，侦探先写下一个可能解释。','把线索拼成尚未证实的猜测','Without evidence, the explanation remains a ___.','certainty','确定事实'],
['erode','v.','侵蚀；逐渐削弱','海浪每天拍击岩石，边缘一点点消失。','rodere（啃咬）→ 慢慢侵蚀','Repeated failures can ___ public confidence.','strengthen','加强'],
['attain','v.','达到；获得','攀登者终于把手伸到山顶的黄色旗帜。','at-（朝向）+ tain（抓住）','Few participants ___ the highest level.','abandon','放弃'],
['impede','v.','妨碍；阻碍','沉重铁链缠住双脚，让跑步者无法向前。','ped（脚）→ 把脚困住','Poor infrastructure may ___ development.','facilitate','促进'],
['tentative','adj.','暂定的；试探性的','研究员用铅笔写结论，旁边标着“可能还要改”。','tentare（尝试）','The team reached a ___ conclusion.','definitive','确定的'],
['scrutiny','n.','仔细审查；严密检查','审查员拿放大镜逐行检查报告。','scrutari（搜查）→ 细致审视','The findings were subjected to close ___.','neglect','忽视']];
let i=0,m='learn',K=new Set(),lock=false;const app=document.getElementById('app'),count=document.getElementById('count'),fill=document.getElementById('fill'),status=document.getElementById('status');function stats(){count.textContent=K.size;fill.style.width=K.size/W.length*100+'%';status.textContent='掌握进度 '+Math.round(K.size/W.length*100)+'%'}function list(){return W.map((x,n)=>`<button class="${n==i?'on':''} ${K.has(x[0])?'done':''}" onclick="i=${n};render()">${String(n+1).padStart(2,'0')} ${x[0]}</button>`).join('')}function speak(word){const utterance=new SpeechSynthesisUtterance(word);utterance.lang='en-GB';speechSynthesis.cancel();speechSynthesis.speak(utterance)}function learn(){let x=W[i];return `<div class="grid"><article class="card lesson"><div class="meta"><span>WORD ${i+1} / ${W.length}</span><span>${x[1]}</span></div><div class="word"><div><h2>${x[0]}</h2><div class="phon">点击右侧听发音</div></div><button class="sound" aria-label="播放 ${x[0]} 发音" onclick="speak('${x[0]}')">♪</button></div><div class="scene"><small>记忆画面</small><p>${x[3]}</p></div><div class="example"><small>IELTS 阅读例句</small><p>“${x[5].replace('___','_______')}”</p></div><button class="reveal" onclick="this.style.display='none';this.nextElementSibling.classList.add('show')">先猜词义，再翻答案 ↗</button><div class="answer"><b>${x[2]}</b><p><strong>构词钩子：</strong>${x[4]}</p></div><div class="actions"><button onclick="next()">稍后再记</button><button class="got" onclick="K.add('${x[0]}');next()">我真的记住了 ✓</button></div></article><aside class="card map"><h3>Lesson 07 · 16 词地图</h3><div class="list">${list()}</div><div class="tip">💡 先让学生表演画面，再说词义；答不出时只提示词根。</div></aside></div>`}function quiz(){let x=W[i],o=Math.random()>.5?[[x[2],1],[x[7],0]]:[[x[7],0],[x[2],1]];return `<section class="card quiz"><small>CONTEXT CHALLENGE · ${i+1}/${W.length}</small><h2>哪个意思能放进句子？</h2><div class="question">${x[5].replace('___','<strong>'+x[0]+'</strong>')}</div><div class="choices">${o.map(a=>`<button onclick="ans(this,${a[1]})">${a[0]}</button>`).join('')}</div><div id="feedback" class="feedback"><b>${x[0]} = ${x[2]}</b><br>${x[3]}</div></section>`}function ans(b,ok){if(lock)return;lock=true;b.classList.add(ok?'correct':'wrong');if(ok)K.add(W[i][0]);const feedback=document.getElementById('feedback');feedback.classList.add('show');feedback.innerHTML+=`<br><button onclick="next()">下一题 →</button>`;stats()}function boss(){let x=W[Math.floor(Math.random()*W.length)];return `<section class="card boss"><small>CLASSROOM GAME</small><h2>禁说中文描述赛</h2><p>只能用动作、同义词或情境让队友猜。</p><div class="bossword"><strong>${x[0]}</strong><p>${x[1]} · 不准直接翻译</p><button onclick="render()">换一个词 ↻</button></div></section>`}function next(){i=(i+1)%W.length;lock=false;render()}function render(){app.innerHTML=m==='learn'?learn():m==='quiz'?quiz():boss();stats()}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');m=b.dataset.m;lock=false;render()});render();
</script></body></html>
